server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied under the same origin as the app. That is why the project needs
    # no CORS configuration at all — the browser never makes a cross-origin request, so
    # there is nothing to preflight.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: /jobs/<uuid> is a React Router path, not a file on disk, so
    # unknown paths fall back to index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
