# Response headers every answer from this server carries. Included at server level AND
# again in each location that sets an add_header of its own: nginx inherits add_header
# from the enclosing level only into locations that have none, so a location with its
# own Cache-Control would otherwise silently drop all of these.
#
# `always` adds them to error answers too (404, 502), which are pages a browser renders.

# A response is the type it says it is: no sniffing a JSON body into a script.
add_header X-Content-Type-Options "nosniff" always;
# Full URLs (a candidate's id in the path) never leave the site in a Referer.
add_header Referrer-Policy "same-origin" always;
# Never framed, so never clickjacked. X-Frame-Options for older browsers; CSP's
# frame-ancestors below for the rest.
add_header X-Frame-Options "DENY" always;

# Content-Security-Policy. Everything comes from this origin: the bundle, its CSS, and
# the API (proxied under /api, so connect-src 'self' covers it).
#
#   script-src  the bundle, plus the one inline script in index.html — the theme
#               applied before first paint — allowed by its SHA-256. Two hashes: the
#               same script with LF and with CRLF line endings, because a Windows
#               checkout builds index.html with CRLF and the browser hashes the bytes it
#               is served. EDIT THAT SCRIPT AND THESE HASHES MUST CHANGE TOO —
#               src/test/csp.test.ts fails until they do, and prints the new values.
#   style-src   the built stylesheet only. React applies `style` props through the
#               CSSOM, which CSP does not restrict, so no 'unsafe-inline'.
#   img-src     data: for inline images (avatars and icons are inline SVG today).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-h+Dx1mwr5s/i1PHzcTr8FHcRdfc6IGGcFFGyUO1Z8ks=' 'sha256-xOyDV0Gi98I/wXtc0mbQC/Ox404pTShzVd9e5tt3wk4='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
