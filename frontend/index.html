<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartHire</title>
    <meta name="description" content="SmartHire — recruitment platform console" />
    <meta name="theme-color" content="#f5f7f7" />
    <script>
      // Applies the saved theme before the first paint, so a dark-mode user never sees
      // a white flash. Mirrors ThemeProvider (src/hooks/useTheme.tsx), which takes over
      // once React runs; the storage key must match THEME_STORAGE_KEY there.
      (function () {
        var preference = "system";
        try {
          preference = JSON.parse(localStorage.getItem("smarthire.theme")) || "system";
        } catch (e) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
