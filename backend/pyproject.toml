[project]
name = "smarthire-backend"
version = "0.1.0"
description = "SmartHire — Intelligent Workforce Orchestration & Recruitment Platform (backend)"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The test engine is session-scoped, so its connection pool lives in the session's event
# loop. Tests must share that loop — asyncpg connections cannot cross loops, and doing so
# raises "got Future attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Migration bodies are machine-generated by `alembic revision --autogenerate`.
# Reformatting them creates noise in diffs and risks editing applied schema history.
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
