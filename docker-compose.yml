# SmartHire — full local stack.
#
#   docker compose up --build     start Postgres, run migrations, serve API and web
#   docker compose run --rm seed  load demo data into the running stack
#   docker compose down           stop, keeping data
#   docker compose down -v        stop and wipe the database volume
#
# Startup order is enforced, not hoped for: db must report healthy, then migrate must
# exit 0, and only then does api start. web and seed wait for api to report healthy.
#
# CONFIGURATION
# Every value that differs between environments comes from the root .env file (copy
# .env.example). Each ${VAR:-default} below falls back to the default when the variable
# is unset. POSTGRES_PASSWORD is the exception: it has no default, so .env is required.

name: smarthire

# Shared by every service that runs the backend image. env_file hands the whole .env to
# the container, so the backend reads exactly the variables documented in .env.example;
# `environment` then overrides only what must differ inside the Compose network.
x-backend: &backend
  build: ./backend
  # One tag for every service that runs backend code, so migrate, api and (later)
  # worker can never run different builds of the same source.
  image: smarthire-backend
  env_file:
    - path: .env
      required: false
  environment: &backend-environment
    ENVIRONMENT: docker
    # Containers reach each other by service name. "localhost" inside a container means
    # the container itself, so the host must be "db" here whatever .env says.
    POSTGRES_HOST: db
    # The port *inside* the Compose network is always 5432. DB_HOST_PORT only changes
    # where the database is published on your machine.
    POSTGRES_PORT: 5432
    TEMPORAL_ADDRESS: temporal:7233
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:17-alpine
    container_name: smarthire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthire}
      # No fallback: the password comes from .env or nowhere. Compose stops with this
      # message instead of starting a database with a password baked into this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
    ports:
      # Published so the test suite and a GUI client can reach it from the host — and
      # only from the host: loopback, not every interface the machine has.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarthire} -d ${POSTGRES_DB:-smarthire}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Temporal: the workflow engine. It stores every workflow's history, hands tasks to
  # workers, and retries what fails. `server start-dev` runs the whole server — frontend,
  # history, matching — in one process with SQLite storage and the web UI built in. That
  # is a development topology: production runs the services separately against
  # Postgres or Cassandra, or uses Temporal Cloud.
  temporal:
    image: temporalio/temporal:1.9.1
    container_name: smarthire-temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      # Under the image user's home: a fresh named volume copies that directory's
      # ownership, so the non-root server can write to it. Workflow history survives
      # `docker compose down`; `down -v` wipes it with the database.
      - --db-filename=/home/temporal/temporal.db
    ports:
      # Loopback only, like the database: neither port has any authentication.
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"   # gRPC: workers and the API connect here
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8233"  # web UI: http://localhost:8233
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Redis: short-lived records with an expiry — idempotency keys today. Configured as
  # a cache, not a store: no snapshots, no append-only file. Losing it loses only
  # replays, never data; the database constraints still hold every rule.
  redis:
    image: redis:7.4-alpine
    container_name: smarthire-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # Loopback only: this Redis has no password, and holds cached API responses.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: brings the schema up to date, then exits. Running migrations as a distinct
  # step — rather than in the API's startup hook — means a failed migration stops the
  # deploy instead of leaving a half-migrated app serving, and it runs once rather than
  # once per API replica.
  migrate:
    <<: *backend
    container_name: smarthire-migrate
    command: alembic upgrade head
    volumes:
      # The same code the api runs (it bind-mounts app/ for --reload): without these,
      # migrate applied the image's migrations while the api served the working tree's
      # models — new models against an old schema, until the next --build.
      - ./backend/app:/code/app
      - ./backend/migrations:/code/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: smarthire-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      # Bind mount so --reload picks up edits without a rebuild.
      - ./backend/app:/code/app
    healthcheck:
      # Readiness, not liveness: "healthy" should mean the API can reach its database.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs workflow and activity code. The API only asks Temporal to *start* a workflow;
  # this process polls Temporal's task queue and does the work. Several can run side
  # by side (`docker compose up -d --scale worker=3`) and Temporal spreads tasks across
  # them — which is why this service, unlike the others, has no fixed container_name:
  # Docker requires every container's name to be unique.
  # Code is bind-mounted like the API's, but a worker does not hot-reload:
  # `docker compose restart worker` after editing workflow or activity code.
  worker:
    <<: *backend
    restart: unless-stopped
    command: python -m app.worker
    # Longer than WORKER_SHUTDOWN_GRACE_SECONDS (20), so running activities get their
    # grace period before Docker escalates to SIGKILL.
    stop_grace_period: 30s
    volumes:
      - ./backend/app:/code/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  # Static build served by nginx, which also proxies /api to the api service. Same origin
  # for app and API, so the project needs no CORS configuration anywhere.
  web:
    build: ./frontend
    container_name: smarthire-web
    restart: unless-stopped
    environment:
      # Substituted into nginx.conf.template when the container starts.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    ports:
      - "${WEB_HOST_PORT:-3000}:80"
    healthcheck:
      # nginx answering the console's own page; busybox wget ships with nginx:alpine.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # Demo data, on demand: `docker compose run --rm seed`. The "tools" profile keeps it
  # out of a plain `docker compose up`.
  # Two steps. First the staff accounts, through the CLI: an admin (the first admin can
  # only be made here; the console's Team page invites everyone after that) and a
  # recruiter, so both views can be tried. --exist-ok makes a re-run harmless. Then
  # seed.py, which goes through the HTTP API like any client: it signs in as the
  # recruiter, and registers and applies as each candidate.
  # The backend image, because the first step needs the backend code and database.
  seed:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        : "$${SEED_PASSWORD:?is not set - add it to .env, see .env.example}"
        printf %s "$$SEED_PASSWORD" |
          python -m app.auth.cli create-admin "$${SEED_ADMIN_EMAIL:-admin@example.com}" \
            --name "$${SEED_ADMIN_NAME:-Nadia Malik}" --password-stdin --exist-ok
        email="$${SEED_RECRUITER_EMAIL:-recruiter@example.com}"
        name="$${SEED_RECRUITER_NAME:-Sara Ahmed}"
        printf %s "$$SEED_PASSWORD" |
          python -m app.auth.cli create-recruiter "$$email" --name "$$name" \
            --password-stdin --exist-ok
        python /scripts/seed.py
    environment:
      <<: *backend-environment
      SMARTHIRE_API_URL: http://api:8000
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      api:
        condition: service_healthy

  # Database browser, on demand: `docker compose up -d pgadmin`, then
  # http://localhost:5050. In the "tools" profile like seed, so a plain `up` skips it.
  # Desktop mode: no pgAdmin login screen. The server list comes from the servers.json
  # config below, imported on the volume's first start; the database password is asked
  # once in the UI and kept in the pgadmin-data volume.
  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: smarthire-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # The image refuses to start without these, but desktop mode never asks for them:
      # they only name pgAdmin's internal user. Not a credential for anything.
      PGADMIN_DEFAULT_EMAIL: pgadmin@smarthire.dev
      PGADMIN_DEFAULT_PASSWORD: unused-in-desktop-mode
    ports:
      # Loopback only: with no login screen, this must not be reachable from the network.
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

# Generated by Compose from .env, so the pre-registered connection follows POSTGRES_USER
# and POSTGRES_DB like everything else. A file on disk would hard-code them. pgAdmin
# reads it only on the pgadmin-data volume's first start: after changing either value,
# `docker compose rm -sf pgadmin && docker volume rm smarthire_pgadmin-data`.
configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "SmartHire",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-smarthire}",
            "Username": "${POSTGRES_USER:-smarthire}",
            "SSLMode": "prefer"
          }
        }
      }

volumes:
  pgdata:
  temporal-data:
  pgadmin-data:
